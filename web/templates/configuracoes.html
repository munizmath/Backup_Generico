{% extends "base.html" %}

{% block title %}Configurações - Sistema de Backup Avançado{% endblock %}

{% block page_title %}Configurações{% endblock %}

{% block content %}
<div class="page-content fade-in">
    <div class="settings-grid">
        <div class="card settings-card">
            <h3 class="card-title">Configurações de Backup</h3>
            <form id="backupSettingsForm" data-validate onsubmit="saveBackupSettings(event)">
                <div class="form-group">
                    <label for="backup_dir" class="form-label">Diretório de Backup</label>
                    <input 
                        type="text" 
                        id="backup_dir" 
                        name="backup_dir" 
                        class="form-input" 
                        placeholder="./backups"
                        required
                        data-label="Diretório de backup"
                    >
                    <div class="form-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="max_backups" class="form-label">Número Máximo de Backups</label>
                    <input 
                        type="number" 
                        id="max_backups" 
                        name="max_backups" 
                        class="form-input" 
                        min="1"
                        max="100"
                        required
                        data-label="Número máximo de backups"
                    >
                    <div class="form-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="compression_level" class="form-label">Nível de Compactação (0-9)</label>
                    <input 
                        type="number" 
                        id="compression_level" 
                        name="compression_level" 
                        class="form-input" 
                        min="0"
                        max="9"
                        required
                        data-label="Nível de compactação"
                    >
                    <div class="form-error"></div>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input 
                            type="checkbox" 
                            id="verify_checksum" 
                            name="verify_checksum"
                            class="checkbox-input"
                        >
                        <span>Verificar Checksum</span>
                    </label>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input 
                            type="checkbox" 
                            id="verify_integrity" 
                            name="verify_integrity"
                            class="checkbox-input"
                        >
                        <span>Verificar Integridade</span>
                    </label>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        Salvar Configurações
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="resetSettings()">
                        Restaurar Padrões
                    </button>
                </div>
            </form>
        </div>
        
        <div class="card settings-card">
            <h3 class="card-title">Exclusões</h3>
            <div class="exclusions-list">
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="exclude_node_modules" class="checkbox-input">
                        <span>node_modules</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="exclude_build" class="checkbox-input">
                        <span>build</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="exclude_git" class="checkbox-input">
                        <span>.git</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="exclude_logs" class="checkbox-input">
                        <span>logs</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="exclude_env" class="checkbox-input" checked>
                        <span>.env</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="exclude_dist" class="checkbox-input">
                        <span>dist</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="exclude_coverage" class="checkbox-input">
                        <span>coverage</span>
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: var(--spacing-xl);
}

.settings-card {
    padding: var(--spacing-xl);
}

.form-actions {
    display: flex;
    gap: var(--spacing-md);
    margin-top: var(--spacing-xl);
    padding-top: var(--spacing-lg);
    border-top: 1px solid var(--glass-border);
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: var(--spacing-md);
    padding: var(--spacing-md);
    cursor: pointer;
    border-radius: 8px;
    transition: background var(--transition-fast);
}

.checkbox-label:hover {
    background: rgba(255, 255, 255, 0.05);
}

.checkbox-input {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: var(--accent-color);
}

.checkbox-group {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-xs);
}

.exclusions-list {
    margin-top: var(--spacing-lg);
}
</style>

<script>
async function loadSettings() {
    try {
        const response = await window.backupSystem.apiRequest('/api/config');
        if (response.success && response.data) {
            populateSettings(response.data);
        }
    } catch (error) {
        console.error('Erro ao carregar configurações:', error);
    }
}

function populateSettings(data) {
    if (data.backup) {
        document.getElementById('backup_dir').value = data.backup.backup_dir || '';
        document.getElementById('max_backups').value = data.backup.max_backups || 5;
        document.getElementById('compression_level').value = data.backup.compression_level || 6;
        document.getElementById('verify_checksum').checked = data.backup.verify_checksum || false;
        document.getElementById('verify_integrity').checked = data.backup.verify_integrity || false;
        
        // Exclusões
        const patterns = data.backup.exclude_patterns || [];
        document.getElementById('exclude_node_modules').checked = patterns.includes('node_modules');
        document.getElementById('exclude_build').checked = patterns.includes('build');
        document.getElementById('exclude_git').checked = patterns.includes('.git');
        document.getElementById('exclude_logs').checked = patterns.includes('logs');
        document.getElementById('exclude_env').checked = patterns.includes('.env');
        document.getElementById('exclude_dist').checked = patterns.includes('dist');
        document.getElementById('exclude_coverage').checked = patterns.includes('coverage');
    }
}

async function saveBackupSettings(event) {
    event.preventDefault();
    
    const formData = {
        backup_dir: document.getElementById('backup_dir').value,
        max_backups: parseInt(document.getElementById('max_backups').value),
        compression_level: parseInt(document.getElementById('compression_level').value),
        verify_checksum: document.getElementById('verify_checksum').checked,
        verify_integrity: document.getElementById('verify_integrity').checked
    };
    
    try {
        // Salvar cada configuração
        for (const [key, value] of Object.entries(formData)) {
            await window.backupSystem.apiRequest('/api/config', {
                method: 'POST',
                body: JSON.stringify({
                    section: 'backup',
                    key: key,
                    value: value
                })
            });
        }
        
        window.backupSystem.showNotification('Configurações salvas com sucesso!', 'success');
    } catch (error) {
        window.backupSystem.showNotification('Erro ao salvar configurações', 'error');
        console.error('Erro:', error);
    }
}

function resetSettings() {
    if (confirm('Deseja restaurar as configurações padrão?')) {
        populateSettings({
            backup: {
                backup_dir: './backups',
                max_backups: 5,
                compression_level: 6,
                verify_checksum: true,
                verify_integrity: true,
                exclude_patterns: ['node_modules', 'build', '.git', 'logs', '.env', 'dist', 'coverage']
            }
        });
        window.backupSystem.showNotification('Configurações restauradas para padrão', 'info');
    }
}

document.addEventListener('DOMContentLoaded', function() {
    loadSettings();
});
</script>
{% endblock %}
